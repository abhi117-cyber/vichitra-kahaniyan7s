<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>विचित्र कहानियाँ | Abhishek Yadav</title>

<link rel="icon"
href="https://abhi117-cyber.github.io/vichitra-kahaniyan7s/favicon.jpg?v=3">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Noto Serif Devanagari",serif;
    background:#f4f7fb;
    color:#182848;
    overflow-x:hidden;
    transition:.4s ease;
}

button,
input,
textarea{
    font-family:inherit;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

.loader{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at center,#203b68,#071225 70%);

    color:white;

    transition:.7s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-book{
    font-size:65px;
    animation:bookFloat 1.5s ease-in-out infinite;
}

.loader h2{
    margin-top:15px;
    font-family:"Yatra One",cursive;
    font-size:28px;
}

.loader-bar{
    width:180px;
    height:4px;
    margin-top:22px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.15);
}

.loader-bar span{
    display:block;
    width:50%;
    height:100%;
    border-radius:20px;
    background:#7dd3fc;
    animation:loaderMove 1.2s infinite;
}

@keyframes loaderMove{
    from{transform:translateX(-120%);}
    to{transform:translateX(300%);}
}

@keyframes bookFloat{
    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-12px) rotate(5deg);
    }
}


/* =====================================================
   PARTICLES
===================================================== */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.particle{
    position:absolute;
    bottom:-50px;
    color:#496cff;
    opacity:.12;

    animation:
        particleUp linear infinite;
}

@keyframes particleUp{

    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.18;
    }

    100%{
        transform:
            translateY(-120vh)
            rotate(360deg);

        opacity:0;
    }

}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:5000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 5%;

    background:
        rgba(7,18,37,.72);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);

}

.logo{

    color:white;

    text-decoration:none;

    font-family:"Yatra One",cursive;

    font-size:23px;

}

.nav-actions{

    display:flex;

    gap:8px;

}

.nav-button{

    width:43px;
    height:43px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    background:
        rgba(255,255,255,.1);

    color:white;

    font-size:19px;

    transition:.35s;

}

.nav-button:hover{

    background:white;

    color:#17233d;

    transform:
        translateY(-3px)
        rotate(8deg);

}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:94vh;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        120px 20px
        80px;

    overflow:hidden;

    color:white;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(125,211,252,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(99,102,241,.22),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #071225,
            #18345d,
            #08152b
        );

}

.hero::before{

    content:"";

    position:absolute;

    width:550px;
    height:550px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:50%;

    animation:
        circleRotate 25s linear infinite;

}

.hero::after{

    content:"";

    position:absolute;

    width:850px;
    height:850px;

    border:
        1px solid
        rgba(255,255,255,.05);

    border-radius:50%;

    animation:
        circleRotate 35s linear infinite reverse;

}

@keyframes circleRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.hero-content{

    position:relative;

    z-index:3;

    max-width:900px;

}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        9px 18px;

    border-radius:50px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:blur(10px);

    animation:
        fadeDown 1s ease;

}

.hero h1{

    margin-top:22px;

    font-family:"Yatra One",cursive;

    font-size:
        clamp(48px,9vw,92px);

    line-height:1.15;

    background:

        linear-gradient(
            90deg,
            #fff,
            #9de6ff,
            #fff
        );

    background-size:200% auto;

    color:transparent;

    background-clip:text;
    -webkit-background-clip:text;

    animation:
        titleAppear 1s ease,
        textShine 5s linear infinite;

}

.hero h1 span{

    color:#7dd3fc;

}

.hero p{

    max-width:720px;

    margin:20px auto;

    color:
        rgba(255,255,255,.82);

    font-size:18px;

    line-height:1.9;

    animation:
        fadeUp 1.5s ease;

}

.hero-buttons{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:13px;

    margin-top:30px;

    animation:
        fadeUp 1.8s ease;

}

.hero-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:
        14px 25px;

    border-radius:50px;

    text-decoration:none;

    font-weight:800;

    transition:.35s;

}

.primary{

    color:#17233d;

    background:white;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.2);

}

.primary:hover{

    transform:
        translateY(-5px)
        scale(1.03);

}

.secondary{

    color:white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.25);

}

.secondary:hover{

    background:white;

    color:#17233d;

    transform:
        translateY(-5px);

}

.scroll-down{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    font-size:28px;

    animation:
        scrollBounce 1.5s infinite;

}

@keyframes titleAppear{

    from{

        opacity:0;

        transform:
            translateY(35px)
            scale(.95);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}

@keyframes fadeDown{

    from{

        opacity:0;

        transform:
            translateY(-20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(25px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}

@keyframes textShine{

    to{
        background-position:200% center;
    }

}

@keyframes scrollBounce{

    0%,100%{
        transform:
            translate(-50%,0);
    }

    50%{
        transform:
            translate(-50%,10px);
    }

}


/* =====================================================
   SECTION
===================================================== */

.section{

    width:92%;

    max-width:1180px;

    margin:auto;

    padding:90px 0;

}

.section-title{

    text-align:center;

    margin-bottom:45px;

}

.section-title small{

    color:#64748b;

    letter-spacing:2px;

}

.section-title h2{

    margin-top:8px;

    font-size:40px;

    color:#182848;

}

.section-title h2::after{

    content:"";

    display:block;

    width:75px;

    height:4px;

    margin:15px auto;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #182848,
            #526dff
        );

}

.section-title p{

    color:#64748b;

    font-size:17px;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

    max-width:700px;

    margin:
        0 auto 45px;

    position:relative;

}

.search-box input{

    width:100%;

    padding:
        17px 55px
        17px 22px;

    border:none;

    outline:none;

    border-radius:50px;

    background:white;

    color:#182848;

    font-size:16px;

    box-shadow:
        0 10px 35px
        rgba(15,23,42,.08);

    transition:.3s;

}

.search-box input:focus{

    transform:
        translateY(-2px);

    box-shadow:
        0 14px 40px
        rgba(76,111,255,.18);

}

.search-icon{

    position:absolute;

    right:20px;

    top:50%;

    transform:
        translateY(-50%);

}


/* =====================================================
   STORY GRID
===================================================== */

.story-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:25px;

}

.story-card{

    position:relative;

    overflow:hidden;

    min-height:325px;

    padding:28px;

    border-radius:25px;

    background:
        rgba(255,255,255,.95);

    border:
        1px solid
        rgba(15,23,42,.06);

    box-shadow:
        0 12px 35px
        rgba(15,23,42,.07);

    opacity:0;

    transform:
        translateY(40px);

    transition:
        .45s ease;

}

.story-card.visible{

    opacity:1;

    transform:
        translateY(0);

}

.story-card:hover{

    transform:
        translateY(-10px);

    box-shadow:
        0 25px 60px
        rgba(15,23,42,.15);

}

.story-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-80px;
    right:-70px;

    border-radius:50%;

    background:
        rgba(76,111,255,.09);

    transition:.5s;

}

.story-card:hover::before{

    transform:scale(1.5);

}

.story-number{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#edf2ff;

    color:#3452c6;

    font-weight:800;

    margin-bottom:20px;

}

.story-card h3{

    position:relative;

    z-index:2;

    color:#182848 !important;

    font-size:24px;

    margin-bottom:12px;

}

.story-card p{

    position:relative;

    z-index:2;

    color:#64748b;

    line-height:1.85;

    font-size:15px;

}

.story-date{

    display:block;

    position:relative;

    z-index:2;

    margin-top:15px;

    color:#94a3b8;

    font-size:13px;

}

.story-link{

    display:inline-flex;

    position:relative;

    z-index:2;

    align-items:center;

    gap:7px;

    margin-top:20px;

    color:#3452c6;

    text-decoration:none;

    font-weight:800;

    transition:.3s;

}

.story-link:hover{

    gap:14px;

}

.like-button{

    position:absolute;

    right:20px;
    bottom:20px;

    width:43px;
    height:43px;

    border:none;

    border-radius:50%;

    background:#f1f5f9;

    cursor:pointer;

    font-size:18px;

    transition:.3s;

}

.like-button:hover{

    transform:scale(1.12);

}

.like-button.liked{

    background:#ffe4e6;

    animation:
        heartPop .35s ease;

}

@keyframes heartPop{

    50%{
        transform:scale(1.3);
    }

}
