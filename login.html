<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | विचित्र कहानियाँ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #f4f1ea;
}

.login-box {
    width: 90%;
    max-width: 400px;

    background: white;

    padding: 30px;

    border-radius: 18px;

    box-shadow: 0 5px 20px #ccc;

    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    object-fit: cover;

    margin-bottom: 10px;
}

h1 {
    color: #182848;

    font-size: 28px;
}

h2 {
    color: #333;

    margin-bottom: 20px;
}

input {
    width: 100%;

    padding: 14px;

    margin: 8px 0;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}

button {
    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border: none;

    border-radius: 8px;

    background: #182848;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    background: #243b6b;
}

.switch-btn {
    background: transparent;

    color: #182848;

    border: 1px solid #182848;
}

#message {
    margin-top: 15px;

    font-weight: bold;

    line-height: 1.5;
}

</style>

</head>


<body>


<div class="login-box">


    <img
        src="favicon.jpg"
        class="logo"
        alt="विचित्र कहानियाँ"
    >


    <h1>
        📖 विचित्र कहानियाँ
    </h1>


    <h2 id="title">
        🔐 Login
    </h2>


    <input
        type="text"
        id="username"
        placeholder="अपना नाम / Username"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        id="mainButton"
        onclick="handleAccount()"
    >
        🔓 Login करें
    </button>


    <button
        class="switch-btn"
        id="switchButton"
        onclick="toggleMode()"
    >
        📝 नया Account बनाएँ
    </button>


    <p id="message"></p>


</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://uhvstqieyyogjidfnhvu.supabase.co";


/*
   IMPORTANT:
   अपनी Supabase PUBLISHABLE KEY यहाँ डालें.
   यह sb_publishable_... से शुरू होगी.
*/

const SUPABASE_KEY =
"sb_publishable_cEbtfpMaQp1650sZ7W2O5g_-u2NUqQG";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   LOGIN / REGISTER MODE
========================================= */

let registerMode = false;


/* =========================================
   LOGIN / REGISTER बदलना
========================================= */

function toggleMode() {

    registerMode = !registerMode;


    const title =
        document.getElementById("title");


    const mainButton =
        document.getElementById("mainButton");


    const switchButton =
        document.getElementById("switchButton");


    const message =
        document.getElementById("message");


    message.innerText = "";


    if (registerMode) {

        title.innerText =
            "📝 नया Account बनाएँ";


        mainButton.innerText =
            "✅ Account बनाएँ";


        switchButton.innerText =
            "🔐 पहले से Account है? Login करें";

    }

    else {

        title.innerText =
            "🔐 Login";


        mainButton.innerText =
            "🔓 Login करें";


        switchButton.innerText =
            "📝 नया Account बनाएँ";

    }

}


/* =========================================
   MAIN BUTTON
========================================= */

async function handleAccount() {


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    /* खाली field check */

    if (!username || !password) {

        message.innerText =
            "❌ नाम और Password दोनों डालें।";

        return;

    }


    /* Loading */

    message.innerText =
        "⏳ कृपया प्रतीक्षा करें...";


    /* =====================================
       REGISTER
    ===================================== */

    if (registerMode) {


        const { data, error } =
            await supabaseClient.rpc(
                "register_user",
                {
                    p_username: username,
                    p_password: password
                }
            );


       if (error) {

    console.error("REGISTER ERROR:", error);

    message.innerText =
        "❌ " + error.message;

    return;
}

        if (!data || !data.success) {

            message.innerText =
                "❌ " +
                (data?.message ||
                "Account नहीं बन पाया।");

            return;

        }


        /* Account successfully created */

        message.innerText =
            "✅ Account बन गया! अब Login करें।";


        registerMode = false;


        document
            .getElementById("title")
            .innerText = "🔐 Login";


        document
            .getElementById("mainButton")
            .innerText = "🔓 Login करें";


        document
            .getElementById("switchButton")
            .innerText =
                "📝 नया Account बनाएँ";


        document
            .getElementById("password")
            .value = "";


        return;

    }


    /* =====================================
       LOGIN
    ===================================== */


    const { data, error } =
        await supabaseClient.rpc(
            "login_user",
            {
                p_username: username,
                p_password: password
            }
        );


    if (error) {

        console.error(error);

        message.innerText =
            "❌ Login में समस्या हुई।";

        return;

    }


    if (!data || !data.success) {

        message.innerText =
            "❌ Username या Password गलत है।";

        return;

    }


    /* =====================================
       LOGIN SUCCESS
    ===================================== */


    sessionStorage.setItem(
    "loggedIn",
    "true"
);

      
   sessionStorage.setItem(
    "username",
    data.username
);


    message.innerText =
        "✅ Login सफल!";


    /* थोड़ी देर बाद index.html */

   setTimeout(function() {
    window.location.href = "./index.html";
}, 1500);
      

</script>


</body>

</html>
