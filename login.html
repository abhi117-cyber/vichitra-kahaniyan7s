<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | विचित्र कहानियाँ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ==============================
   BASIC
============================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #ffffff, #f4f1ea 60%, #e5ded2);

    overflow: hidden;
}


/* ==============================
   BACKGROUND ANIMATION
============================== */

body::before,
body::after {
    content: "";
    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background: rgba(24, 40, 72, 0.08);

    filter: blur(10px);

    animation: float 7s ease-in-out infinite;

    z-index: -1;
}

body::before {
    top: -80px;
    left: -80px;
}

body::after {
    right: -80px;
    bottom: -80px;

    animation-delay: 2s;
}

@keyframes float {

    0%, 100% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(30px, 25px) scale(1.15);
    }
}


/* ==============================
   LOGIN BOX
============================== */

.login-box {

    width: 90%;
    max-width: 400px;

    background: rgba(255,255,255,0.95);

    padding: 32px;

    border-radius: 22px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.15);

    text-align: center;

    animation: boxIn 0.8s ease;

    backdrop-filter: blur(10px);
}

@keyframes boxIn {

    from {
        opacity: 0;
        transform: translateY(50px) scale(0.92);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* ==============================
   LOGO
============================== */

.logo {

    width: 90px;
    height: 90px;

    border-radius: 50%;

    object-fit: cover;

    margin-bottom: 10px;

    animation: logoIn 1s ease;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.18);
}

@keyframes logoIn {

    from {
        opacity: 0;
        transform: scale(0.4) rotate(-20deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}


/* ==============================
   TITLE
============================== */

h1 {

    color: #182848;

    font-size: 28px;

    margin: 8px 0 12px;

    animation: fadeIn 1s ease;
}

h2 {

    color: #333;

    margin-bottom: 20px;

    transition: 0.3s;
}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* ==============================
   INPUTS
============================== */

.input-group {

    animation: inputIn 0.7s ease both;
}

.input-group:nth-of-type(1) {
    animation-delay: 0.2s;
}

.input-group:nth-of-type(2) {
    animation-delay: 0.35s;
}

input {

    width: 100%;

    padding: 14px;

    margin: 8px 0;

    border: 1px solid #ccc;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

    transition:
        border 0.3s,
        box-shadow 0.3s,
        transform 0.2s;
}

input:focus {

    border-color: #182848;

    box-shadow:
        0 0 0 3px rgba(24,40,72,0.12);

    transform: translateY(-2px);
}

@keyframes inputIn {

    from {
        opacity: 0;
        transform: translateX(-25px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}


/* ==============================
   BUTTON
============================== */

button {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border: none;

    border-radius: 10px;

    background: #182848;

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}

button:hover {

    background: #243b6b;

    transform: translateY(-2px);

    box-shadow:
        0 7px 18px rgba(24,40,72,0.25);
}

button:active {

    transform: scale(0.97);
}


/* ==============================
   SWITCH BUTTON
============================== */

.switch-btn {

    background: transparent;

    color: #182848;

    border: 1px solid #182848;

    box-shadow: none;
}

.switch-btn:hover {

    background: #182848;

    color: white;

}


/* ==============================
   MESSAGE
============================== */

#message {

    margin-top: 15px;

    font-weight: bold;

    line-height: 1.5;

    min-height: 24px;

}


/* ==============================
   LOADING
============================== */

.loading {

    display: inline-block;

    width: 18px;
    height: 18px;

    border: 3px solid rgba(255,255,255,0.4);

    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;

    vertical-align: middle;

    margin-right: 7px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 600px) {

    .login-box {
        padding: 25px;
    }

    h1 {
        font-size: 25px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <img
        src="favicon.jpg"
        class="logo"
        alt="विचित्र कहानियाँ"
    >


    <h1>
        📖 विचित्र कहानियाँ
    </h1>


    <h2 id="title">
        🔐 Login
    </h2>


    <div class="input-group">

        <input
            type="text"
            id="username"
            placeholder="अपना नाम / Username"
            autocomplete="username"
        >

    </div>


    <div class="input-group">

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

    </div>


    <button
        id="mainButton"
        onclick="handleAccount()"
    >
        🔓 Login करें
    </button>


    <button
        class="switch-btn"
        id="switchButton"
        onclick="toggleMode()"
    >
        📝 नया Account बनाएँ
    </button>


    <p id="message"></p>


</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://uhvstqieyyogjidfnhvu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_cEbtfpMaQp1650sZ7W2O5g_-u2NUqQG";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   MODE
========================================= */

let registerMode = false;


/* =========================================
   TOGGLE MODE
========================================= */

function toggleMode() {

    registerMode = !registerMode;

    const title =
        document.getElementById("title");

    const mainButton =
        document.getElementById("mainButton");

    const switchButton =
        document.getElementById("switchButton");

    const message =
        document.getElementById("message");


    message.innerText = "";


    if (registerMode) {

        title.innerText =
            "📝 नया Account बनाएँ";

        mainButton.innerText =
            "✅ Account बनाएँ";

        switchButton.innerText =
            "🔐 पहले से Account है? Login करें";

    } else {

        title.innerText =
            "🔐 Login";

        mainButton.innerText =
            "🔓 Login करें";

        switchButton.innerText =
            "📝 नया Account बनाएँ";
    }

}


/* =========================================
   MAIN FUNCTION
========================================= */

async function handleAccount() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    const mainButton =
        document.getElementById("mainButton");


    if (!username || !password) {

        message.innerText =
            "❌ नाम और Password दोनों डालें।";

        return;
    }


    /* LOADING */

    mainButton.disabled = true;

    mainButton.innerHTML =
        '<span class="loading"></span> कृपया प्रतीक्षा करें...';


    /* =====================================
       REGISTER
    ===================================== */

    if (registerMode) {

        const { data, error } =
            await supabaseClient.rpc(
                "register_user",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );

            message.innerText =
                "❌ " + error.message;

            mainButton.disabled = false;

            mainButton.innerText =
                "✅ Account बनाएँ";

            return;
        }


        if (!data || !data.success) {

            message.innerText =
                "❌ " +
                (data?.message ||
                "Account नहीं बन पाया।");

            mainButton.disabled = false;

            mainButton.innerText =
                "✅ Account बनाएँ";

            return;
        }


        message.innerText =
            "✅ Account बन गया! अब Login करें।";


        registerMode = false;


        document
            .getElementById("title")
            .innerText = "🔐 Login";


        mainButton.innerText =
            "🔓 Login करें";


        document
            .getElementById("switchButton")
            .innerText =
                "📝 नया Account बनाएँ";


        document
            .getElementById("password")
            .value = "";


        mainButton.disabled = false;

        return;
    }


    /* =====================================
       LOGIN
    ===================================== */

    const { data, error } =
        await supabaseClient.rpc(
            "login_user",
            {
                p_username: username,
                p_password: password
            }
        );


    if (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        message.innerText =
            "❌ " + error.message;

        mainButton.disabled = false;

        mainButton.innerText =
            "🔓 Login करें";

        return;
    }


    if (!data || !data.success) {

        message.innerText =
            "❌ Username या Password गलत है।";

        mainButton.disabled = false;

        mainButton.innerText =
            "🔓 Login करें";

        return;
    }


    /* =====================================
       LOGIN SUCCESS
    ===================================== */

    sessionStorage.setItem(
        "loggedIn",
        "true"
    );


    sessionStorage.setItem(
        "username",
        data.username
    );


    message.innerText =
        "✅ Login सफल!";


    /* =====================================
       OPEN INDEX
    ===================================== */

    setTimeout(function() {

        window.location.href =
            "./index.html";

    }, 800);

}

</script>


</body>

</html>
