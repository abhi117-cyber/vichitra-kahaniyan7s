<!DOCTYPE html>
<html lang="hi">
    
<script>
    if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | विचित्र कहानियाँ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f4f1ea;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #ccc;
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
}

h1 {
    color: #182848;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #182848;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.switch-btn {
    background: transparent;
    color: #182848;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}

</style>

</head>


<body>

<div class="login-box">

    <img
        src="favicon.jpg"
        class="logo"
        alt="विचित्र कहानियाँ"
    >

    <h1>📖 विचित्र कहानियाँ</h1>

    <h2 id="title">🔐 Login</h2>


    <input
        type="text"
        id="username"
        placeholder="अपना नाम / Username"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button id="mainButton" onclick="loginUser()">
        🔓 Login करें
    </button>


    <button
        class="switch-btn"
        onclick="toggleMode()"
        id="switchButton"
    >
        नया Account बनाएँ
    </button>


    <p id="message"></p>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://uhvstqieyyogjidfnhvu.supabase.co";


const SUPABASE_KEY =
"ABHI7S";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   MODE
========================================= */

let registerMode = false;


/* =========================================
   TOGGLE LOGIN / REGISTER
========================================= */

function toggleMode() {

    registerMode = !registerMode;

    const title =
        document.getElementById("title");

    const mainButton =
        document.getElementById("mainButton");

    const switchButton =
        document.getElementById("switchButton");

    const message =
        document.getElementById("message");


    message.innerText = "";


    if (registerMode) {

        title.innerText =
            "📝 नया Account बनाएँ";

        mainButton.innerText =
            "✅ Account बनाएँ";

        switchButton.innerText =
            "🔐 पहले से Account है? Login करें";

    } else {

        title.innerText =
            "🔐 Login";

        mainButton.innerText =
            "🔓 Login करें";

        switchButton.innerText =
            "📝 नया Account बनाएँ";

    }

}


/* =========================================
   MAIN BUTTON
========================================= */

async function loginUser() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    if (!username || !password) {

        message.innerText =
            "❌ नाम और Password दोनों डालें।";

        return;
    }


    message.innerText =
        "⏳ कृपया प्रतीक्षा करें...";


    /* =====================================
       REGISTER
    ===================================== */

    if (registerMode) {

        const { data, error } =
            await supabaseClient.rpc(
                "register_user",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            console.error(error);

            message.innerText =
                "❌ Account बनाने में समस्या हुई।";

            return;
        }


        if (!data.success) {

            message.innerText =
                "❌ " + data.message;

            return;
        }


        message.innerText =
            "✅ Account बन गया! अब Login करें।";


        registerMode = false;

        document.getElementById("title")
            .innerText = "🔐 Login";

        document.getElementById("mainButton")
            .innerText = "🔓 Login करें";

        document.getElementById("switchButton")
            .innerText = "📝 नया Account बनाएँ";


        document.getElementById("password")
            .value = "";


        return;
    }


    /* =====================================
       LOGIN
    ===================================== */

    const { data, error } =
        await supabaseClient.rpc(
            "login_user",
            {
                p_username: username,
                p_password: password
            }
        );


    if (error) {

        console.error(error);

        message.innerText =
            "❌ Login में समस्या हुई।";

        return;
    }


    if (!data.success) {

        message.innerText =
            "❌ Username या Password गलत है।";

        return;
    }


    /* =====================================
       LOGIN SUCCESS
    ===================================== */

    sessionStorage.setItem(
        "loggedIn",
        "true"
    );


    sessionStorage.setItem(
        "username",
        data.username
    );


    message.innerText =
        "✅ Login सफल!";


    setTimeout(function() {

        window.location.replace(
            "index.html"
        );

    }, 500);

}

</script>

</body>

</html>
